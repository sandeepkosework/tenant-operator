{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tenant-operator.postgresSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  password: {{ include "tenant-operator.postgresPassword" . | quote }}
{{- end }}
