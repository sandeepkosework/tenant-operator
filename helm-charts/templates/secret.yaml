{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tenant-operator.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if and .Values.postgresql.enabled (not (hasKey .Values.secret "DATABASE_URL")) }}
  # In-chart Postgres (postgresql.enabled=true) -- assembled from
  # postgresql.auth.* and the Service this chart renders itself (see
  # postgres-service.yaml/postgres-deployment.yaml). Set DATABASE_URL
  # explicitly under `secret` to point at an external Postgres instead.
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:%v/%s" .Values.postgresql.auth.username (include "tenant-operator.postgresPassword" .) (include "tenant-operator.postgresFullname" .) .Values.postgresql.service.port .Values.postgresql.auth.database | quote }}
{{- end }}
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
