# Pinned at 1 by design -- git_service.py's write lock and status_bus.py's
# Socket.IO pub/sub are both in-process only, safe for exactly one replica.
# Don't raise this without first moving the git lock to a Mongo-backed
# distributed lock and the status bus to Redis pub/sub.
replicaCount: 1

image:
  repository: sandeepkosework/tenant-operator
  tag: "0.2.7"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Which environment this deployment serves -- "stage" or "prod". One
# release == one environment; run a second release (its own namespace/
# config/secrets) for the other one.
environment: stage

# Any Settings field, UPPER_SNAKE -> ConfigMap -> envFrom. Non-secret
# config only (git repo URL, Argo CD server address, Vault address, DB
# URL, cluster registry path, etc).
config: {}

# Secret-shaped config (git/GHCR/Vault/Argo CD tokens) -> Secret -> envFrom.
# Prefer existingSecretName for anything real -- inline values here end up
# in this release's Helm history in plaintext.
secret: {}
existingSecretName: ""

# Vault Agent Injector sidecar for the operator's *own* config bootstrap
# (secret/tenant-operator/config) -- separate from vault_service.py's
# runtime tenant-secret writes, which always go through VAULT_TOKEN/
# VAULT_TOKEN_FILE in config/secret above regardless of this setting.
vault:
  enabled: false
  role: tenant-operator

# SSH deploy key for git, if using git@... over SSH instead of an HTTPS
# token (GIT_HTTPS_TOKEN in `secret` above).
git:
  sshKey:
    existingSecretName: ""
    privateKey: ""
    keyName: id_rsa

# Only needed when this release's target cluster(s) for tenant workloads
# are NOT the cluster this operator itself runs on (KUBECONFIG_PATH stays
# unset / in-cluster otherwise).
kubeconfig:
  existingSecretName: ""
  content: ""

# Overrides the clusters.yaml baked into the image at build time --
# mount this release's real cluster registry instead, so the same image
# works across environments without rebuilding.
clustersConfig:
  existingConfigMapName: ""
  inline: ""

# Backs GIT_LOCAL_PATH (the operator's local clone of the GitOps repo).
persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""
  existingClaimName: ""

# Dedicated MongoDB instance for THIS operator's own bookkeeping DB
# (DATABASE_MONGO_URI/DATABASE_MONGO_DB_NAME -- set those in `config`/
# `secret` above to point at the Service this renders: "<fullname>-
# mongodb.<namespace>.svc.cluster.local:27017"). Deliberately separate from
# the unrelated shared MongoDB instance used for tenant application data +
# the env-config mirror (MONGO_ENV_CONFIG_URI, see doc/MONGODB_SETUP.md) --
# that one lives on a spoke; this one is rendered by this same chart so it
# runs on whichever cluster the operator itself runs on (see app/config.py's
# comment on why that matters). Set enabled: false and point
# DATABASE_MONGO_URI at an externally managed instance instead if you don't
# want this chart to own it.
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7"
  auth:
    rootUsername: root
    # Prefer this for anything real -- must contain keys
    # MONGO_INITDB_ROOT_USERNAME/MONGO_INITDB_ROOT_PASSWORD. Inline
    # rootPassword below ends up in this release's Helm history in
    # plaintext, same caveat as `secret` above.
    existingSecretName: ""
    rootPassword: ""   # required if existingSecretName is blank -- not auto-generated, see templates/mongodb.yaml
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
    existingClaimName: ""
  resources: {}

rbac:
  # Baseline ClusterRole -- read-only spoke-fleet health checks, plus the
  # one deliberate `delete` verb on namespaces (Argo CD's CreateNamespace=
  # true creates a tenant namespace but never tracks/prunes it).
  create: true
  # Prod-only, off by default: namespaced Role for Crossplane OKE claims.
  crossplane:
    enabled: false
    apiGroup: oke.platform.example.com
    resource: okeclusterclaims
    namespace: ""

# Paired with the image's non-root uid 1000 -- without this, mounted
# Secret volumes (git key, kubeconfig) are root-owned and unreadable.
podSecurityContext:
  fsGroup: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
