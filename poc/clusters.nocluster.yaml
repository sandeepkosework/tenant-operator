# Local spoke registry for poc/run_local_no_cluster.py -- no real cluster
# behind either entry. context/argocd_cluster_server are never dialed for
# real because argocd_service/kubernetes_service are monkeypatched by that
# script to always report "healthy" instantly.
#
# stage and prod each get their own dedicated spoke (never shared) --
# mirrors the real fleet, where stage and prod are entirely separate
# hub-and-spoke setups.

clusters:
  - name: spoke-1
    context: local-spoke-1
    argocd_cluster_server: https://local-spoke-1.internal:6443
    max_tenants: 1000
    environments: ["stage"]
    region: us-east-1

  - name: spoke-prod-1
    context: local-spoke-prod-1
    argocd_cluster_server: https://local-spoke-prod-1.internal:6443
    max_tenants: 1000
    environments: ["prod"]
    region: us-east-1
