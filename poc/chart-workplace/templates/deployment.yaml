apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tenant.id }}
  namespace: {{ .Values.tenant.namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Values.tenant.id }}
    app.kubernetes.io/name: workplace
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.tenant.id }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Values.tenant.id }}
        app.kubernetes.io/name: workplace
      {{- if .Values.vault.enabled }}
      annotations:
        # Vault Agent Injector: authenticates as this pod's ServiceAccount
        # (Kubernetes auth method, role from .Values.vault.role) and renders
        # this tenant's secrets -- written by
        # vault_service.write_initial_tenant_secrets(), see
        # secret/tenants/{{ .Values.tenant.id }}/{redis,database,mongo,jwt} --
        # into four KEY=value files under /vault/secrets/, one per suffix.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-redis: "secret/data/tenants/{{ .Values.tenant.id }}/redis"
        vault.hashicorp.com/agent-inject-template-redis: |
          {{ printf `{{- with secret "secret/data/tenants/%s/redis" -}}
          REDIS_HOST={{ .Data.data.redis_host }}
          REDIS_PASSWORD={{ .Data.data.password }}
          {{- end }}` .Values.tenant.id }}
        vault.hashicorp.com/agent-inject-secret-database: "secret/data/tenants/{{ .Values.tenant.id }}/database"
        vault.hashicorp.com/agent-inject-template-database: |
          {{ printf `{{- with secret "secret/data/tenants/%s/database" -}}
          DB_HOST={{ .Data.data.db_host }}
          DB_PORT={{ .Data.data.db_port }}
          DB_USERNAME={{ .Data.data.db_username }}
          DB_PASSWORD={{ .Data.data.db_password }}
          {{- end }}` .Values.tenant.id }}
        vault.hashicorp.com/agent-inject-secret-mongo: "secret/data/tenants/{{ .Values.tenant.id }}/mongo"
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{ printf `{{- with secret "secret/data/tenants/%s/mongo" -}}
          MONGO_HOST={{ .Data.data.db_host }}
          MONGO_PORT={{ .Data.data.db_port }}
          MONGO_ROOT_USERNAME={{ .Data.data.root_username }}
          MONGO_ROOT_PASSWORD={{ .Data.data.root_password }}
          {{- end }}` .Values.tenant.id }}
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/tenants/{{ .Values.tenant.id }}/jwt"
        vault.hashicorp.com/agent-inject-template-jwt: |
          {{ printf `{{- with secret "secret/data/tenants/%s/jwt" -}}
          JWT_ISSUER={{ .Data.data.jwt_issuer }}
          JWT_ALGORITHM={{ .Data.data.jwt_algorithm }}
          JWT_SECRET={{ .Data.data.jwt_secret }}
          {{- end }}` .Values.tenant.id }}
      {{- end }}
    spec:
      containers:
        - name: workplace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- if .Values.vault.enabled }}
          # nginxdemos/hello doesn't read env files natively -- source every
          # Agent-rendered secret file (plain KEY=value lines; generated
          # secrets are alphanumeric-only, safe to source unquoted) then exec
          # the image's normal entrypoint so nginx (PID 1) inherits them.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              set -a
              for f in /vault/secrets/*; do
                [ -f "$f" ] && . "$f"
              done
              set +a
              echo "[vault-secrets] loaded env keys: $(env | grep -E '^(DB_|REDIS_|MONGO_|JWT_)' | cut -d= -f1 | sort | tr '\n' ' ')"
              exec nginx -g 'daemon off;'
          {{- end }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
