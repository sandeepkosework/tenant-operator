kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tenant-poc
nodes:
  - role: control-plane
    extraPortMappings:
      # Maps host localhost:8443 straight to argocd-server's NodePort
      # (30443, set up after install -- see poc/POC.md) -- avoids
      # `kubectl port-forward`, which is too flaky under an operator's
      # sustained polling for real testing (repeated TLS connection churn
      # through the tunnel intermittently fails).
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
