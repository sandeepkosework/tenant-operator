# Vault running in DEV MODE -- for testing the tenant-operator's Vault
# integration against a real Vault server, not for anything resembling
# production. Dev mode: single replica, in-memory storage (data is lost on
# every restart), auto-unsealed, fixed root token "root", TLS disabled.
#
# For a real deployment, use the official HashiCorp Vault Helm chart with
# persistent (raft) storage, auto-unseal (KMS/Transit), TLS, and real
# token/AppRole auth instead of a static root token -- this manifest is
# intentionally not that.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
            - -dev-root-token-id=root
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - containerPort: 8200
              name: http
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
