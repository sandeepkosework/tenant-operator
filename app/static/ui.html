<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tenant Operator</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --text:#1b2433; --muted:#6a7587; --line:#e4e8ef; --soft:#f0f3f8;
    --accent:#2f6fed; --accent-soft:#e6eefe;
    --ok:#1f9d63; --ok-soft:#e3f6ec; --bad:#d93b3b; --bad-soft:#fdeaea;
    --warn:#c77d0a; --warn-soft:#fdf1dc; --prog:#2f6fed; --prog-soft:#e6eefe; --gray:#8793a6; --gray-soft:#eef1f5;
    --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0f131a; --card:#171c25; --text:#e8ecf3; --muted:#8c97a9; --line:#262d3a; --soft:#1d2330;
    --accent:#6b9bff; --accent-soft:#1a2745;
    --ok:#3ecf8e; --ok-soft:#14302a; --bad:#ff6b6b; --bad-soft:#3a1c20;
    --warn:#f0b04a; --warn-soft:#3a2e16; --prog:#6b9bff; --prog-soft:#1a2745; --gray:#8c97a9; --gray-soft:#222a38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer}
  .muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  [hidden]{display:none!important}

  /* header */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}
  .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7a5cff);display:grid;place-items:center;color:#fff;font-size:15px}
  .spacer{flex:1}
  .live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
  .dot.off{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,99,.5)}70%{box-shadow:0 0 0 7px rgba(31,157,99,0)}100%{box-shadow:0 0 0 0 rgba(31,157,99,0)}}
  .btn{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff} .btn.danger:hover{filter:brightness(1.08)}
  .btn.ghost-danger{color:var(--bad);border-color:transparent;background:transparent} .btn.ghost-danger:hover{background:var(--bad-soft)}
  .btn:disabled{opacity:.45;cursor:default}

  main{max-width:1280px;margin:0 auto;padding:22px 28px 60px}
  .alert{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin-bottom:14px}

  /* summary tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);text-align:left;color:var(--text);position:relative;overflow:hidden}
  .tile:hover{border-color:var(--accent)} .tile.active{outline:2px solid var(--accent);outline-offset:-1px}
  .tile .n{font-size:28px;font-weight:700;line-height:1.1} .tile .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--gray))}

  /* toolbar */
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
  .search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}

  /* table */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{padding:10px 14px;text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line);background:var(--soft)}
  td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)} tbody tr:last-child td{border-bottom:0}
  .tname{font-weight:600} .actions{white-space:nowrap;text-align:right}
  .empty{padding:44px;text-align:center;color:var(--muted)}

  /* status badges */
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--b-soft,var(--gray-soft));color:var(--b,var(--gray))}
  .badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .badge.prog i{animation:blink 1.1s infinite} @keyframes blink{50%{opacity:.25}}
  .s-ok{--b:var(--ok);--b-soft:var(--ok-soft)} .s-bad{--b:var(--bad);--b-soft:var(--bad-soft)}
  .s-prog{--b:var(--prog);--b-soft:var(--prog-soft)} .s-warn{--b:var(--warn);--b-soft:var(--warn-soft)} .s-gray{--b:var(--gray);--b-soft:var(--gray-soft)}

  /* progress bar */
  .pbar{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden;min-width:150px}
  .pbar>div{height:100%;border-radius:99px;background:var(--c,var(--prog));transition:width .6s ease}
  .pbar.running>div{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);background-size:16px 16px;animation:stripe 1s linear infinite}
  @keyframes stripe{to{background-position:16px 0}}
  .pwrap{min-width:190px} .pline{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:12px;color:var(--muted)}
  .pline span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:31;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  aside.open{transform:none}
  .dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .dhead h2{margin:0;font-size:18px} .dhead .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .x{margin-left:auto;border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:2px 8px;border-radius:6px} .x:hover{background:var(--soft)}
  .dbody{padding:18px 22px;overflow:auto;flex:1}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px} h3:first-child{margin-top:0}
  .errbox{background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin:14px 0;word-break:break-word}
  .bigbar{margin:14px 0 4px} .bigbar .pbar{height:12px}

  /* stepper */
  .steps{list-style:none;margin:0;padding:0}
  .step{position:relative;display:flex;gap:13px;padding-bottom:16px}
  .step:last-child{padding-bottom:0}
  .step::before{content:"";position:absolute;left:12px;top:26px;bottom:-2px;width:2px;background:var(--line)}
  .step:last-child::before{display:none} .step.done::before,.step.warn::before,.step.skipped::before{background:var(--ok)}
  .ico{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--gray);z-index:1}
  .step.done .ico{background:var(--ok);border-color:var(--ok);color:#fff} .step.warn .ico{background:var(--warn);border-color:var(--warn);color:#fff}
  .step.failed .ico{background:var(--bad);border-color:var(--bad);color:#fff} .step.skipped .ico{background:var(--gray-soft);border-color:var(--gray);color:var(--gray)}
  .step.running .ico{border-color:var(--prog);border-top-color:transparent;animation:spin .8s linear infinite;color:transparent}
  @keyframes spin{to{transform:rotate(360deg)}}
  .step .t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .step .lbl{font-weight:600}
  .step.pending .lbl{color:var(--muted);font-weight:500} .step .dur{color:var(--muted);font-size:12px}
  .step .msg{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word} .step.failed .msg{color:var(--bad)} .step.warn .msg{color:var(--warn)}

  /* log + details */
  .log{background:var(--soft);border-radius:10px;padding:8px 12px;max-height:230px;overflow:auto;font-size:12px}
  .log div{padding:3px 0;display:flex;gap:10px} .log .tm{color:var(--muted);flex:none;font-family:ui-monospace,Menlo,monospace}
  .log .st{flex:none;width:70px;color:var(--muted)}
  details>summary{cursor:pointer;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;font-weight:600}
  dl.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:0} dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-all}
  .copy{border:0;background:transparent;color:var(--accent);padding:0 0 0 6px;font-size:12px}

  /* login */
  #login{max-width:380px;margin:14vh auto;padding:0 16px}
  #login .card{padding:26px} #login h1{margin:0 0 4px;font-size:20px}
  #login input{width:100%;padding:10px 12px;margin:5px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
  #login label{font-size:12px;color:var(--muted)}

  /* confirm dialog + toast */
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:22px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,15,25,.5)} dialog h3{margin:0 0 8px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}
  dialog input{width:100%;padding:9px 11px;margin:10px 0 4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
  .dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px}
  .toast.err{background:var(--bad);color:#fff}

  .tablewrap{overflow-x:auto}
  header .btn,.live{white-space:nowrap}
  @media(max-width:900px){
    .tiles{grid-template-columns:repeat(2,1fr)} header,main{padding-left:14px;padding-right:14px}
    header{gap:10px} header .small{display:none} .live span:last-child{font-size:11px}
    th.hide-m,td.hide-m{display:none} .pwrap{min-width:120px} .pbar{min-width:100px}
    td,th{padding:11px 10px} .actions .btn[data-act=open]{display:none} .pline span:first-child{max-width:130px}
    .badge{padding:3px 8px}
  }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <div class="brand" style="margin-bottom:14px"><div class="logo">T</div>Tenant Operator</div>
    <h1>Sign in</h1><p class="muted" style="margin-top:0">Admin login</p>
    <div id="msg" class="alert" hidden></div>
    <form id="loginForm">
      <label for="u">Username</label><input id="u" autocomplete="username" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="logo">T</div>Tenant Operator</div>
    <div class="spacer"></div>
    <div class="live"><span class="dot" id="liveDot"></span><span id="liveTxt">Live</span></div>
    <a href="/docs" target="_blank" rel="noopener" class="small">API docs</a>
    <button class="btn" id="logout">Sign out</button>
  </header>

  <main>
    <div id="loadErr" class="alert" hidden></div>

    <div class="tiles">
      <button class="tile" data-filter="all"      style="--c:var(--accent)"><div class="n" id="nAll">0</div><div class="l">Tenants</div></button>
      <button class="tile" data-filter="running"  style="--c:var(--ok)"><div class="n" id="nRun">0</div><div class="l">Running</div></button>
      <button class="tile" data-filter="progress" style="--c:var(--prog)"><div class="n" id="nProg">0</div><div class="l">In progress</div></button>
      <button class="tile" data-filter="failed"   style="--c:var(--bad)"><div class="n" id="nFail">0</div><div class="l">Failed</div></button>
    </div>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search by name, domain or cluster…" aria-label="Search tenants">
      <label class="chk"><input type="checkbox" id="showDeleted"> Show deleted</label>
    </div>

    <div class="card tablewrap">
      <table>
        <thead><tr>
          <th>Tenant</th><th class="hide-m">Cluster</th><th>Status</th><th>Progress</th><th class="hide-m">Created</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No tenants match.</div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Tenant details">
  <div class="dhead">
    <div><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div>
    <button class="x" id="dClose" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <span class="muted small" id="dFootTxt"></span>
    <button class="btn danger" id="dDelete">Delete tenant</button>
  </div>
</aside>

<dialog id="confirm">
  <h3>Delete this tenant?</h3>
  <p class="muted" style="margin:0 0 4px">This removes its manifest and namespace. Databases and secrets are not dropped. Type <b id="cName"></b> to confirm.</p>
  <input id="cInput" autocomplete="off" aria-label="Type the tenant name to confirm">
  <div class="dlgbtns"><button class="btn" id="cCancel">Cancel</button><button class="btn danger" id="cOk" disabled>Delete</button></div>
</dialog>
<div id="toasts"></div>

<script>
const API = "/api/v1";
const $ = id => document.getElementById(id);
let token = ""; try { token = sessionStorage.getItem("token") || ""; } catch (_) {}
const authHdr = () => token ? {Authorization: "Bearer " + token} : {};
const S = { tenants: [], prog: {}, filter: "all", q: "", showDeleted: false, open: null, openProg: null, timer: null, dTimer: null, lastOk: 0 };

/* ---------- helpers ---------- */
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GROUP = st => st === "RUNNING" ? "running" : st === "FAILED" ? "failed" : st === "DELETED" ? "deleted"
  : st === "DELETING" ? "deleting" : "progress";
const BADGE = { running: ["s-ok","Running"], failed: ["s-bad","Failed"], deleted: ["s-gray","Deleted"], deleting: ["s-warn","Deleting"], progress: ["s-prog","In progress"] };
function timeAgo(iso){
  if(!iso) return "–"; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if(s < 60) return Math.floor(s) + "s ago"; if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago"; return Math.floor(s/86400) + "d ago";
}
const clock = iso => iso ? new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}) : "";
function dur(sec){ if(sec == null) return ""; if(sec < 1) return "<1s"; if(sec < 60) return Math.round(sec) + "s"; const m = Math.floor(sec/60); return m + "m " + String(Math.round(sec%60)).padStart(2,"0") + "s"; }
function toast(msg, err){ const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; $("toasts").appendChild(t); setTimeout(() => t.remove(), 4200); }
async function api(path, opts = {}){
  const r = await fetch(API + path, {...opts, headers: {...authHdr(), ...(opts.headers || {})}});
  if(r.status === 401){ signOut(); throw new Error("session expired"); }
  return r;
}
function show(which){ $("login").hidden = which !== "login"; $("app").hidden = which !== "app"; }
function signOut(){ token = ""; try { sessionStorage.removeItem("token"); } catch (_) {} clearInterval(S.timer); closeDrawer(); show("login"); }

/* ---------- login ---------- */
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("msg").hidden = true;
  const r = await fetch(API + "/auth/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username:$("u").value, password:$("p").value})});
  if(!r.ok){ $("msg").textContent = (await r.json().catch(() => ({}))).detail || "Login failed"; $("msg").hidden = false; return; }
  token = (await r.json()).token; try { sessionStorage.setItem("token", token); } catch (_) {}
  $("p").value = ""; enter();
};
$("logout").onclick = signOut;
function enter(){ show("app"); refresh(); clearInterval(S.timer); S.timer = setInterval(() => { if(!document.hidden) refresh(); }, 3000); }

/* ---------- list ---------- */
async function refresh(){
  try {
    const r = await api("/tenant");
    if(!r.ok){ showErr(`Could not load tenants: HTTP ${r.status} ${(await r.json().catch(() => ({}))).detail || ""}`); live(false); return; }
    showErr(""); S.tenants = await r.json(); S.lastOk = Date.now(); live(true);
    // current step + percent for tenants still being created
    const active = S.tenants.filter(t => GROUP(t.status) === "progress"
      || (GROUP(t.status) === "failed" && S.prog[t.id]?.status !== t.status)).slice(0, 30);
    await Promise.all(active.map(async t => { try { const p = await api(`/tenant/${t.id}/progress`); if(p.ok) S.prog[t.id] = await p.json(); } catch (_) {} }));
    render();
  } catch (e) { if(e.message !== "session expired"){ showErr("Could not reach the operator: " + e.message); live(false); } }
}
function showErr(m){ $("loadErr").textContent = m; $("loadErr").hidden = !m; }
function live(ok){ $("liveDot").classList.toggle("off", !ok); $("liveTxt").textContent = ok ? "Live · updated " + timeAgo(new Date(S.lastOk).toISOString()) : "Disconnected"; }
setInterval(() => { if(S.lastOk && !$("app").hidden) live(Date.now() - S.lastOk < 12000); }, 1000);

function visible(){
  const q = S.q.trim().toLowerCase();
  return S.tenants.filter(t => {
    const g = GROUP(t.status);
    if(g === "deleted" && !S.showDeleted) return false;
    if(S.filter !== "all" && g !== S.filter) return false;
    return !q || [t.tenantName, t.slug, t.displayName, t.domain, t.cluster].some(x => (x || "").toLowerCase().includes(q));
  });
}
function pct(t){ const p = S.prog[t.id], g = GROUP(t.status);
  return ((g === "progress" || g === "failed") && p && p.hasDetail && p.percent != null) ? p.percent : t.progress; }
function failedAt(t){ const s = S.prog[t.id]?.steps?.find(x => x.state === "failed"); return s ? s.label : ""; }

function render(){
  const live = S.tenants.filter(t => GROUP(t.status) !== "deleted");
  $("nAll").textContent = live.length;
  $("nRun").textContent = live.filter(t => GROUP(t.status) === "running").length;
  $("nProg").textContent = live.filter(t => GROUP(t.status) === "progress").length;
  $("nFail").textContent = live.filter(t => GROUP(t.status) === "failed").length;
  document.querySelectorAll(".tile").forEach(b => b.classList.toggle("active", b.dataset.filter === S.filter));

  const list = visible();
  $("empty").hidden = list.length > 0;
  $("rows").innerHTML = list.map(t => {
    const g = GROUP(t.status), [cls, txt] = BADGE[g], p = pct(t), cur = S.prog[t.id]?.currentStep?.label;
    const color = g === "failed" ? "var(--bad)" : g === "running" ? "var(--ok)" : g === "deleting" ? "var(--warn)" : "var(--prog)";
    const sub = g === "failed" ? (failedAt(t) ? "Failed at: " + failedAt(t) : "Failed — see details") : g === "progress" ? (cur || t.status.replaceAll("_"," ").toLowerCase()) : g === "running" ? "All services healthy" : txt;
    return `<tr data-id="${h(t.id)}">
      <td><div class="tname">${h(t.displayName || t.tenantName)}</div><div class="muted small">${h(t.slug)}${t.domain ? " · " + h(t.domain) : ""}</div></td>
      <td class="hide-m"><div>${h(t.cluster || "–")}</div><div class="muted small mono">${h(t.namespace || "")}</div></td>
      <td><span class="badge ${cls} ${g === "progress" ? "prog" : ""}"><i></i>${txt}</span></td>
      <td class="pwrap"><div class="pbar ${g === "progress" ? "running" : ""}"><div style="width:${p}%;--c:${color}"></div></div>
        <div class="pline"><span title="${h(sub)}">${h(sub)}</span><span>${p}%</span></div></td>
      <td class="hide-m muted" title="${h(t.createdAt)}">${timeAgo(t.createdAt)}</td>
      <td class="actions"><button class="btn" data-act="open">Details</button>
        <button class="btn ghost-danger" data-act="del" ${["deleting","deleted"].includes(g) ? "disabled" : ""}>Delete</button></td>
    </tr>`;
  }).join("");
  if(S.open) renderDrawer();
}

$("rows").onclick = e => {
  const tr = e.target.closest("tr[data-id]"); if(!tr) return;
  const id = tr.dataset.id, act = e.target.closest("button")?.dataset.act;
  if(act === "del") askDelete(id); else openDrawer(id);
};
document.querySelectorAll(".tile").forEach(b => b.onclick = () => { S.filter = (S.filter === b.dataset.filter ? "all" : b.dataset.filter); render(); });
$("search").oninput = e => { S.q = e.target.value; render(); };
$("showDeleted").onchange = e => { S.showDeleted = e.target.checked; render(); };

/* ---------- drawer ---------- */
function openDrawer(id){
  S.open = id; S.openProg = S.prog[id] || null;
  $("drawer").classList.add("open"); $("scrim").classList.add("open"); $("drawer").setAttribute("aria-hidden","false");
  renderDrawer(); loadProgress();
  clearInterval(S.dTimer); S.dTimer = setInterval(loadProgress, 2000);
}
function closeDrawer(){ S.open = null; clearInterval(S.dTimer); $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); $("drawer").setAttribute("aria-hidden","true"); }
$("dClose").onclick = closeDrawer; $("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if($("confirm").open) $("confirm").close(); else closeDrawer(); } });

async function loadProgress(){
  const id = S.open; if(!id) return;
  try { const r = await api(`/tenant/${id}/progress`); if(r.ok && S.open === id){ S.openProg = await r.json(); S.prog[id] = S.openProg; renderDrawer(); } } catch (_) {}
}
const ICON = { done: "✓", warn: "!", failed: "✕", skipped: "–", running: "", pending: "" };
function renderDrawer(){
  const t = S.tenants.find(x => x.id === S.open); if(!t) return;
  const g = GROUP(t.status), [cls, txt] = BADGE[g], p = S.openProg, pc = pct(t);
  const color = g === "failed" ? "var(--bad)" : g === "running" ? "var(--ok)" : g === "deleting" ? "var(--warn)" : "var(--prog)";
  $("dTitle").innerHTML = `${h(t.displayName || t.tenantName)} <span class="badge ${cls} ${g === "progress" ? "prog" : ""}" style="vertical-align:middle;margin-left:6px"><i></i>${txt}</span>`;
  $("dSub").textContent = `${t.slug}${t.domain ? " · " + t.domain : ""}`;
  $("dDelete").disabled = ["deleting","deleted"].includes(g);

  let html = `<div class="bigbar"><div class="pbar ${g === "progress" ? "running" : ""}"><div style="width:${pc}%;--c:${color}"></div></div>
    <div class="pline"><span>${h(g === "failed" ? (failedAt(t) ? "Failed at: " + failedAt(t) : "Failed") : (p?.currentStep?.label || (g === "running" ? "Complete" : t.status.toLowerCase())))}</span><span>${pc}%</span></div></div>`;
  if(t.errorMessage) html += `<div class="errbox"><b>Error</b><br>${h(t.errorMessage)}</div>`;

  html += `<h3>Creation steps</h3>`;
  if(p && p.hasDetail){
    html += `<ol class="steps">` + p.steps.map(s => `<li class="step ${s.state}"><span class="ico">${ICON[s.state] ?? ""}</span>
      <div><div class="t"><span class="lbl">${h(s.label)}</span><span class="dur">${s.state === "running" ? "running…" : s.state === "skipped" ? "skipped" : dur(s.durationSeconds)}</span></div>
      ${s.message ? `<div class="msg">${h(s.message)}</div>` : ""}</div></li>`).join("") + `</ol>`;
    html += `<details><summary>Activity log (${p.events.length})</summary><div class="log">` +
      p.events.slice().reverse().map(ev => `<div><span class="tm">${clock(ev.at)}</span><span class="st">${h(ev.step)}</span><span>${h(ev.message || ev.state)}</span></div>`).join("") + `</div></details>`;
  } else {
    html += `<div class="muted">${p ? "No step history was recorded for this tenant (it was created before step tracking was added)." : "Loading…"}</div>`;
  }

  const kv = [["Tenant ID", t.id, 1], ["Name", t.tenantName], ["Slug", t.slug], ["Domain", t.domain], ["Environment", t.environment],
    ["Cluster", t.cluster], ["Namespace", t.namespace, 1], ["Version", t.version], ["Users", t.users], ["Git commit", t.gitCommit ? t.gitCommit.slice(0, 10) : ""],
    ["Hub CR", t.hubCrName], ["Disabled services", (t.disabledServices || []).join(", ")], ["Created", t.createdAt ? new Date(t.createdAt).toLocaleString() : ""], ["Updated", t.updatedAt ? new Date(t.updatedAt).toLocaleString() : ""]];
  html += `<h3>Details</h3><dl class="kv">` + kv.filter(([, v]) => v !== "" && v != null).map(([k, v, c]) =>
    `<dt>${k}</dt><dd>${h(v)}${c ? ` <button class="copy" data-copy="${h(v)}">copy</button>` : ""}</dd>`).join("") + `</dl>`;

  const body = $("dBody"), top = body.scrollTop, openLog = body.querySelector("details")?.open;
  body.innerHTML = html;
  const d = body.querySelector("details"); if(d && openLog) d.open = true;
  body.scrollTop = top;
  $("dFootTxt").textContent = "Refreshes automatically";
}
$("dBody").onclick = e => { const b = e.target.closest("[data-copy]"); if(b){ navigator.clipboard?.writeText(b.dataset.copy).then(() => toast("Copied"), () => {}); } };
$("dDelete").onclick = () => S.open && askDelete(S.open);

/* ---------- delete ---------- */
let delId = null;
function askDelete(id){
  const t = S.tenants.find(x => x.id === id); if(!t) return; delId = id;
  $("cName").textContent = t.slug; $("cInput").value = ""; $("cOk").disabled = true; $("confirm").showModal(); $("cInput").focus();
}
$("cInput").oninput = e => { const t = S.tenants.find(x => x.id === delId); $("cOk").disabled = !t || e.target.value !== t.slug; };
$("cCancel").onclick = () => $("confirm").close();
$("cOk").onclick = async () => {
  const id = delId; $("cOk").disabled = true;
  try {
    const r = await api(`/tenant/${id}`, {method: "DELETE"});
    if(!r.ok){ toast((await r.json().catch(() => ({}))).detail || "Delete failed", true); }
    else { toast("Deletion started"); }
  } catch (e) { if(e.message !== "session expired") toast("Delete failed: " + e.message, true); }
  $("confirm").close(); refresh();
};

token ? enter() : show("login");
</script>
</body>
</html>
