# Template for the secret half of the operator's config, referenced by
# deploy/deployment.yaml's envFrom.secretRef. Copy this file, fill in real
# values, and `kubectl apply` it directly (or run it through your
# org's secret manager / sealed-secrets / external-secrets pipeline) --
# never commit the filled-in copy. .gitignore already blocks
# deploy/*.secret.yaml as a guardrail if you save your filled-in version
# alongside this template.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-operator-secrets
  namespace: tenant-operator
type: Opaque
stringData:
  # DATABASE_URL and ARGOCD_TOKEN moved to Vault (secret/tenant-operator/config,
  # keys database_url/argocd_token) -- fetched at startup by
  # app.vault_bootstrap.load_env_from_vault() via the Vault Agent Injector
  # sidecar (see the vault.hashicorp.com/* annotations in deployment.yaml).
  # Only put them back here if you're not using the Agent Injector for this
  # deployment -- real env vars/Secret values always win over Vault.

  # Only needed if using HTTPS + PAT auth for git instead of the SSH deploy
  # key (deploy/deployment.yaml mounts tenant-operator-git-ssh-key for that):
  # GIT_HTTPS_TOKEN: "CHANGE_ME"

  # --- Vault ---
  # VAULT_ADDR/VAULT_TOKEN_FILE now live in the ConfigMap, not here -- neither
  # is itself a secret when using the Agent Injector (no static VAULT_TOKEN
  # needed at all). Only set a static VAULT_TOKEN here if you're deliberately
  # NOT using the Agent Injector for this deployment.
  # VAULT_TOKEN: "CHANGE_ME"

  # --- Admin login for the web UI (/ui) ---
  # REQUIRED. Every API route (except /health) and Socket.IO need the login
  # token; with this unset they all return 503.
  # Optional: ADMIN_USERNAME (default "admin"), ADMIN_TOKEN_SECRET
  # (defaults to ADMIN_PASSWORD), ADMIN_TOKEN_TTL_SECONDS (default 28800).
  ADMIN_PASSWORD: "CHANGE_ME"
  # Optional static key for scripts/curl (sent as `X-API-Key: ...`), so they
  # don't have to log in. Same access as the admin token. Use a long random
  # value, e.g. `openssl rand -hex 32`.
  # API_KEY: "CHANGE_ME"
