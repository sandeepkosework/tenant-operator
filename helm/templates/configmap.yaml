apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-operator.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if not .Values.clustersConfig.existingConfigMapName }}
---
# Separate ConfigMap (not envFrom'd -- mounted as a file) so this can hold
# multi-line YAML without polluting the operator's own env vars. Overrides
# the clusters.yaml baked into the image at build time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-operator.fullname" . }}-clusters
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tenant-operator.labels" . | nindent 4 }}
data:
  clusters.yaml: |
{{ .Values.clustersConfig.inline | indent 4 }}
{{- end }}
